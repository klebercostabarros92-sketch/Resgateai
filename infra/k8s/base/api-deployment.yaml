apiVersion: apps/v1
kind: Deployment
metadata:
  name: resgate-api
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: resgate-api
  template:
    metadata:
      labels:
        app: resgate-api
    spec:
      containers:
        - name: api
          image: gcr.io/PROJECT_ID/resgate-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: resgate-secrets
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resgate-api-service
  namespace: production
spec:
  selector:
    app: resgate-api
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resgate-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resgate-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
