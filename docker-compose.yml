# ============================================================
# RESGATE AI — Docker Compose (Desenvolvimento)
# Uso: docker compose up -d
# ============================================================

version: "3.9"

networks:
  resgate-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resgate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resgate_ai
      POSTGRES_USER: resgate
      POSTGRES_PASSWORD: resgate123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - resgate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resgate -d resgate_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: resgate-redis
    restart: unless-stopped
    command: redis-server --requirepass resgate123 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - resgate-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "resgate123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: resgate-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: resgate
      RABBITMQ_DEFAULT_PASS: resgate123
      RABBITMQ_DEFAULT_VHOST: resgate
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - resgate-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API (NestJS) ─────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: resgate-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://resgate:resgate123@postgres:5432/resgate_ai?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: resgate123
      RABBITMQ_URL: "amqp://resgate:resgate123@rabbitmq:5672/resgate"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - resgate-network
    command: pnpm run start:dev

  # ── Web (Next.js) ─────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: resgate-web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: ws://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api
    networks:
      - resgate-network
    command: pnpm run dev

  # ── Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: resgate-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - resgate-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"

  # ── Grafana ───────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: resgate-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: resgate123
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "4000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - resgate-network

  # ── MailHog (email dev) ───────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: resgate-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - resgate-network
